<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIO – Monta a estrutura</title>
<style>
  /* --u scales everything: ~10.8 px on a 1920x1080 screen. */
  :root {
    --u: min(1vh, 0.5625vw);
    --u0: min(1vh, 0.5625vw);   /* unscaled unit, for controls inside the zoomable stage */
    --bg: #eef1f6; --ink: #17202c; --muted: #566274; --card: #ffffff;
    --e: #c8501e; --e-tint: #fdeee9; --m: #4b3ec6; --m-tint: #ecebfb;
    --line: #2b3646; --ok: #12763a; --bad: #c0261d; --warn: #b45309; --fio: #0e7490; --hint: #f59e0b; --navy: #0f1b2d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  button { font: inherit; cursor: pointer; }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace; }

  #app { position: fixed; inset: 0; display: grid;
         grid-template-rows: calc(var(--u) * 10) 1fr calc(var(--u) * 11.5); }

  /* ---------- header ---------- */
  #top { display: flex; align-items: center; gap: calc(var(--u) * 2.4); padding: 0 calc(var(--u) * 2.4);
         background: var(--navy); color: #fff; min-width: 0; }
  .brand b { font-size: calc(var(--u) * 4); letter-spacing: .04em; }
  #stepper { display: flex; gap: calc(var(--u) * .8); }
  .st { display: flex; align-items: center; gap: calc(var(--u) * .7); padding: calc(var(--u) * .5) calc(var(--u) * 1.3) calc(var(--u) * .5) calc(var(--u) * .6);
        border-radius: 999px; font-size: calc(var(--u) * 1.9); font-weight: 700; background: rgba(255,255,255,.1); color: rgba(255,255,255,.65); white-space: nowrap; }
  .st b { display: inline-flex; align-items: center; justify-content: center; width: calc(var(--u) * 2.8); height: calc(var(--u) * 2.8);
          border-radius: 50%; background: rgba(255,255,255,.2); font-size: calc(var(--u) * 1.7); }
  .st.cur { background: #ffd23f; color: var(--navy); } .st.cur b { background: var(--navy); color: #ffd23f; }
  .st.done { color: #fff; } .st.done b { background: var(--ok); }
  #status { flex: 1; display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 1.6);
            font-size: calc(var(--u) * 2.1); min-width: 0; white-space: nowrap; }
  #status .score b { font-size: calc(var(--u) * 4); }
  #status .score small { font-size: calc(var(--u) * 1.7); opacity: .8; margin-left: calc(var(--u) * .5); }
  #status .chip { padding: calc(var(--u) * .3) calc(var(--u) * 1); border-radius: 999px; font-weight: 700; background: #fff; font-size: calc(var(--u) * 1.8); }
  #status .chip.ok { color: var(--ok); } #status .chip.bad { color: var(--bad); } #status .chip.miss { color: var(--warn); }
  #status .dim { opacity: .8; }
  .actions { display: flex; gap: calc(var(--u) * 1); }
  .btn { height: calc(var(--u) * 5.8); padding: 0 calc(var(--u) * 2.2); border-radius: calc(var(--u) * 1);
         border: calc(var(--u) * .2) solid transparent; font-size: calc(var(--u) * 2.1); font-weight: 700;
         background: #fff; color: var(--navy); white-space: nowrap; }
  .btn:hover:not(:disabled) { filter: brightness(.94); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn.primary { background: #ffd23f; border-color: #ffd23f; }
  .btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.55); }
  .btn.warnb { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btn.hidden { display: none; }

  /* ---------- stage ---------- */
  #stage.mode-build { --u: calc(min(1vh, 0.5625vw) * var(--scale, 1)); }   /* config.scale shrinks the floating pieces (steps 1 and 2) */
  #stage { position: relative; min-height: 0; overflow: hidden; touch-action: none;
           background: radial-gradient(circle at 50% 40%, #fff, var(--bg) 75%); }
  #field, #cols { position: absolute; inset: 0; display: none; }
  .mode-build #field { display: block; }
  .mode-rel #cols { display: grid; grid-template-columns: 1fr .8fr 1fr; padding: calc(var(--u) * 1.2) calc(var(--u) * 2.4) calc(var(--u) * 1); }

  /* free-floating pieces (steps 1 and 2) */
  .piece { position: absolute; left: 0; top: 0; z-index: 2; will-change: transform; cursor: grab; }
  .piece.card { width: calc(var(--u) * 16); padding: calc(var(--u) * 1) calc(var(--u) * 1) calc(var(--u) * 2.9); text-align: center;
               background: var(--card); border-radius: calc(var(--u) * 1.8); box-shadow: 0 calc(var(--u) * .5) calc(var(--u) * 1.8) rgba(15,27,45,.2);
               border-top: calc(var(--u) * 1) solid var(--accent); }
  .electrical { --accent: var(--e); --tint: var(--e-tint); } .mechanical { --accent: var(--m); --tint: var(--m-tint); }
  .piece .ph { height: calc(var(--u) * 12); display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .piece .thumb { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; pointer-events: none;
                  filter: drop-shadow(0 calc(var(--u) * .3) calc(var(--u) * .5) rgba(15,27,45,.25)); }
  .piece .code { font-size: calc(var(--u) * 2.9); font-weight: 800; line-height: 1.15; pointer-events: none; }
  .piece .nm { font-size: calc(var(--u) * 1.9); color: var(--muted); line-height: 1.15; pointer-events: none; }
  .piece .code { white-space: nowrap; }
  .piece .prop { display: inline-block; max-width: 100%; margin-top: calc(var(--u) * .6); padding: calc(var(--u) * .2) calc(var(--u) * 1);
                 border-radius: 999px; background: var(--tint); color: var(--accent); font-size: calc(var(--u) * 1.6); font-weight: 800;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  .piece .prop::before { content: "🏷 "; }
  .piece.card .prop { font-size: calc(var(--u) * 1.35); padding: calc(var(--u) * .2) calc(var(--u) * .7); }
  .piece .code.long { font-size: calc(var(--u) * 1.9); white-space: normal; overflow-wrap: anywhere; }
  .piece.pill { padding: calc(var(--u) * 1.1) calc(var(--u) * 2.4) calc(var(--u) * 1.9); border-radius: calc(var(--u) * 1.3); font-weight: 800; white-space: nowrap;
                              box-shadow: 0 calc(var(--u) * .4) calc(var(--u) * 1.2) rgba(15,27,45,.2); }
  .piece.pill.station, .piece.pill.fg, .piece.pill.le { background: var(--navy); color: #fff; font-size: calc(var(--u) * 2.9); }
  .piece.pill.fu { background: var(--tint); color: var(--accent); border: calc(var(--u) * .35) solid var(--accent); font-size: calc(var(--u) * 2.5); }
  .piece.pill.bmk, .piece.pill.article, .piece.pill.part { background: #fff; color: var(--ink); border: calc(var(--u) * .3) dashed var(--accent); font-size: calc(var(--u) * 2.3);
                                         font-family: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace; }
  .piece .lbl { pointer-events: none; }
  .knob { position: absolute; left: 50%; bottom: calc(var(--u) * -2); width: calc(var(--u) * 4); height: calc(var(--u) * 4); margin-left: calc(var(--u) * -2);
          border-radius: 50%; background: var(--navy); color: #fff; border: calc(var(--u) * .45) solid #fff; display: flex; align-items: center; justify-content: center;
          font-style: normal; font-weight: 800; font-size: calc(var(--u) * 3); line-height: 1; cursor: crosshair;
          box-shadow: 0 calc(var(--u) * .3) calc(var(--u) * .8) rgba(15,27,45,.4); }
  .knob:hover { background: var(--hint); color: var(--navy); }
  .piece.armed { outline: calc(var(--u) * .5) solid var(--navy); outline-offset: calc(var(--u) * .3); }
  .piece.drop { outline: calc(var(--u) * .6) solid var(--hint); outline-offset: calc(var(--u) * .3); }
  .piece.hint { animation: glow 1s ease-in-out infinite alternate; }
  .piece.shake { animation: shake .35s; }
  .piece.dragging { cursor: grabbing; }
  .locked .piece, .locked .knob { cursor: default; }
  .locked .knob { display: none; }

  /* columns (step 3) */
  .col { display: flex; flex-direction: column; min-height: 0; }
  .col h2 { margin: 0 0 calc(var(--u) * .7); height: calc(var(--u) * 3.2); font-size: calc(var(--u) * 2); letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; }
  #colE h2 { color: var(--e); } #colM h2 { color: var(--m); justify-content: flex-end; }
  .groups { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: calc(var(--u) * 1); }
  .group { display: flex; flex-direction: column; gap: calc(var(--u) * .7); min-height: 0; }
  .ghead { height: calc(var(--u) * 2.8); display: flex; align-items: center; padding: 0 calc(var(--u) * 1.2); font-size: calc(var(--u) * 1.8); font-weight: 700;
           border-radius: calc(var(--u) * .8); white-space: nowrap; overflow: hidden; background: var(--tint); color: var(--accent); }
  .ghead.hint { animation: glow 1s ease-in-out infinite alternate; }
  .cards { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: calc(var(--u) * .7); }
  .piece.rel { position: relative; left: auto; top: auto; flex: 1; min-height: 0; width: auto; display: flex; align-items: center; gap: calc(var(--u) * 1.4);
               padding: calc(var(--u) * .4) calc(var(--u) * 1.4); background: var(--card); text-align: left; border-top: 0;
               border: calc(var(--u) * .25) solid #d5dbe5; border-radius: calc(var(--u) * 1.3); box-shadow: 0 calc(var(--u) * .2) calc(var(--u) * .6) rgba(15,27,45,.1); }
  .piece.rel.electrical { border-left: calc(var(--u) * 1) solid var(--e); }
  .piece.rel.mechanical { border-right: calc(var(--u) * 1) solid var(--m); flex-direction: row-reverse; text-align: right; }
  .piece.rel .ph { flex: none; height: calc(var(--u) * 8.4); width: calc(var(--u) * 8.4); }
  .piece.rel .txt { min-width: 0; flex: 1; pointer-events: none; }
  .piece.rel .code { font-size: calc(var(--u) * 2.7); } .piece.rel .nm { font-size: calc(var(--u) * 1.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .piece.rel:hover { border-color: #9aa7ba; }
  .dot { position: absolute; top: 50%; width: calc(var(--u) * 2); height: calc(var(--u) * 2); margin-top: calc(var(--u) * -1); border-radius: 50%;
         background: #fff; border: calc(var(--u) * .35) solid currentColor; pointer-events: none; }
  .rel.electrical .dot { right: calc(var(--u) * -1.15); color: var(--e); } .rel.mechanical .dot { left: calc(var(--u) * -1.15); color: var(--m); }
  .rel.linked .dot { background: currentColor; }
  .piece.rel.nophoto:not(:hover) .thumb { opacity: 0; }
  .piece.rel .q { position: absolute; display: none; }
  .piece.rel.nophoto:not(:hover) .ph { background: #eef1f5; border: calc(var(--u) * .25) dashed #9aa5b4; border-radius: calc(var(--u) * 1); }
  .locked .piece.rel.nophoto .thumb { opacity: 1; } .locked .piece.rel.nophoto .ph { background: none; border: 0; }

  @keyframes glow { from { box-shadow: 0 0 0 calc(var(--u) * .2) var(--hint), 0 0 calc(var(--u) * .8) var(--hint); }
                    to   { box-shadow: 0 0 0 calc(var(--u) * .6) var(--hint), 0 0 calc(var(--u) * 3) var(--hint); } }
  @keyframes shake { 20% { margin-left: -6px; } 40% { margin-left: 6px; } 60% { margin-left: -4px; } 80% { margin-left: 4px; } }

  #zoomCtl { position: absolute; right: calc(var(--u0) * 1.6); bottom: calc(var(--u0) * 1.4); z-index: 6; display: flex; gap: calc(var(--u0) * .5);
             padding: calc(var(--u0) * .5); background: rgba(255,255,255,.92); border: 1px solid #d5dbe5; border-radius: 999px;
             box-shadow: 0 2px 8px rgba(15,27,45,.15); }
  #zoomCtl button { min-width: calc(var(--u0) * 4.6); height: calc(var(--u0) * 4.6); border: 0; border-radius: 999px; background: #fff;
                    color: var(--navy); font-weight: 800; font-size: calc(var(--u0) * 2.6); line-height: 1; }
  #zoomCtl #zPct { font-size: calc(var(--u0) * 1.7); padding: 0 calc(var(--u0) * 1); }
  #zoomCtl button:hover { background: var(--bg); }
  .mode-rel #zoomCtl { display: none; }
  svg.layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #links { z-index: 1; } #marks { z-index: 3; } #ghost { z-index: 4; }   /* lines under the pieces, markers and drag line above */
  .link .line { fill: none; stroke-linecap: round; stroke-width: calc(var(--u) * .75); stroke: var(--line); }
  .link .halo { fill: none; stroke: #fff; stroke-linecap: round; stroke-width: calc(var(--u) * 1.9); opacity: .8; }
  .link.play .line { stroke: var(--rope, var(--line)); }
  .side-electrical { --rope: #c8501e; } .side-mechanical { --rope: #4b3ec6; }
  .link.dim .halo { display: none; }
  .link .hit { fill: none; stroke: transparent; stroke-width: calc(var(--u) * 2.6); pointer-events: stroke; }
  .link.removable .hit, .link.removable .mk { cursor: pointer; }
  .link:hover .line { stroke-width: calc(var(--u) * .95); }
  .link.ok .line { stroke: var(--rope, var(--ok)); } .link.bad .line { stroke: var(--bad); }
  .link.missing .line { stroke: var(--warn); stroke-width: calc(var(--u) * .9); stroke-dasharray: 0 calc(var(--u) * 1.6); }
  .link.dim { opacity: .16; }
  .link.fio .line { stroke: var(--fio); stroke-width: calc(var(--u) * .8); }
  .link .mk { pointer-events: all; }
  .mk circle { fill: #fff; stroke: var(--line); stroke-width: calc(var(--u) * .3); }
  .mk text { font-weight: 800; text-anchor: middle; dominant-baseline: central; fill: var(--line); }
  .link.removable:hover .mk circle { fill: var(--bad); stroke: var(--bad); } .link.removable:hover .mk text { fill: #fff; }
  .link.ok .mk circle { fill: var(--ok); stroke: var(--ok); } .link.ok .mk text { fill: #fff; }
  .link.bad .mk circle { fill: var(--bad); stroke: var(--bad); } .link.bad .mk text { fill: #fff; }
  .link.missing .mk circle { fill: #fff; stroke: var(--warn); } .link.missing .mk text { fill: var(--warn); }
  .gears { pointer-events: none; }
  .gear-pop, .gear-rot { transform-box: fill-box; transform-origin: center; }
  .gear { stroke: #fff; stroke-width: calc(var(--u) * .25); stroke-linejoin: round; }
  .g1 .gear { fill: var(--m); } .g2 .gear { fill: #8b82e3; }
  .gear-hole { fill: #fff; }
  .link .current, .link .surge { fill: none; stroke-linecap: round; pointer-events: none; }
  .link .current { stroke: #ffd60a; stroke-width: calc(var(--u) * .6); }
  .link .surge { stroke: #ffe94d; stroke-width: calc(var(--u) * 1.5); }
  #ghost path { fill: none; stroke: var(--navy); stroke-width: calc(var(--u) * .75); stroke-linecap: round; stroke-dasharray: 0 calc(var(--u) * 1.5); opacity: .7; }

  /* ---------- footer / details ---------- */
  #info { display: flex; align-items: center; gap: calc(var(--u) * 2.2); padding: 0 calc(var(--u) * 3); background: #fff; border-top: calc(var(--u) * .25) solid #d5dbe5; min-width: 0; }
  #info .msg { font-size: calc(var(--u) * 2.3); color: var(--muted); line-height: 1.3; }
  #info .msg b { color: var(--ink); }
  #info .ibody { flex: 1; min-width: 0; }
  #info .ititle { font-size: calc(var(--u) * 2.7); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #info .ititle small { font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 600; color: var(--muted); font-size: calc(var(--u) * 1.9); margin-left: calc(var(--u) * 1); }
  #info .fields { display: grid; grid-template-columns: 1.6fr 1fr; gap: calc(var(--u) * .2) calc(var(--u) * 2.4); margin-top: calc(var(--u) * .5); font-size: calc(var(--u) * 1.9); }
  #info .fields span { color: var(--muted); }
  #info .fields div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #info .master { margin-top: calc(var(--u) * .3); font-size: calc(var(--u) * 1.95); color: var(--ink); }
  #info .master span { color: var(--muted); font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
  #info .why { font-size: calc(var(--u) * 2.4); font-weight: 600; }
  #info .why.ok { color: var(--ok); } #info .why.bad { color: var(--bad); } #info .why.miss { color: var(--warn); }

  /* ---------- overlays ---------- */
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
             text-align: center; color: #fff; padding: calc(var(--u) * 4); background: radial-gradient(circle at 30% 20%, #1d3557, var(--navy) 70%); }
  .overlay.hidden { display: none; }
  .overlay.dark { background: rgba(15,27,45,.88); }
  .overlay h1 { margin: 0; font-size: calc(var(--u) * 8.4); letter-spacing: .02em; }
  .overlay .kicker { font-size: calc(var(--u) * 2.6); letter-spacing: .25em; text-transform: uppercase; opacity: .7; margin-bottom: calc(var(--u) * 1.5); }
  .overlay .lead { font-size: calc(var(--u) * 3); max-width: calc(var(--u) * 100); margin: calc(var(--u) * 2) 0 calc(var(--u) * 4); opacity: .92; line-height: 1.3; }
  .steps { display: flex; gap: calc(var(--u) * 2.5); margin-bottom: calc(var(--u) * 5); }
  .step { width: calc(var(--u) * 34); padding: calc(var(--u) * 2.2); background: rgba(255,255,255,.08); border-radius: calc(var(--u) * 1.6); font-size: calc(var(--u) * 2.2); line-height: 1.3; text-align: left; }
  .step b { display: block; font-size: calc(var(--u) * 4.4); color: #ffd23f; margin-bottom: calc(var(--u) * .6); }
  .langs { display: flex; gap: calc(var(--u) * 1.5); margin: calc(var(--u) * -2) 0 calc(var(--u) * 3.5); }
  .lang { height: calc(var(--u) * 6); padding: 0 calc(var(--u) * 3); border-radius: 999px; font-size: calc(var(--u) * 2.3); font-weight: 700;
          background: transparent; color: #fff; border: calc(var(--u) * .25) solid rgba(255,255,255,.5); }
  .lang.on { background: #fff; color: var(--navy); border-color: #fff; }
  .btn.big { height: calc(var(--u) * 10); padding: 0 calc(var(--u) * 7); font-size: calc(var(--u) * 4); border-radius: calc(var(--u) * 2); }
  #idle { z-index: 20; }
  /* how-it-works screen */
  .overlay.rules { justify-content: flex-start; overflow: auto; padding-top: calc(var(--u) * 3.5); }
  .overlay.rules h1 { font-size: calc(var(--u) * 6); }
  .rgrid { display: grid; grid-template-columns: 1.15fr 1fr; gap: calc(var(--u) * 5); width: min(100%, calc(var(--u) * 168));
           margin: calc(var(--u) * 3) 0 calc(var(--u) * 3.5); text-align: left; }
  .rcol h3 { margin: 0 0 calc(var(--u) * 1.3); font-size: calc(var(--u) * 2.3); color: #ffd23f; text-transform: uppercase; letter-spacing: .1em; }
  .rcol p { font-size: calc(var(--u) * 2.3); line-height: 1.45; margin: 0 0 calc(var(--u) * 3.2); opacity: .92; }
  .levels { display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); }
  .lvl { position: relative; display: flex; align-items: center; gap: calc(var(--u) * 1.6); }
  .lvl + .lvl::before { content: ""; position: absolute; left: calc(var(--u) * -2.6); top: calc(var(--u) * -2.6); width: calc(var(--u) * 2);
                        height: calc(var(--u) * 4.4); border-left: calc(var(--u) * .3) solid rgba(255,255,255,.45);
                        border-bottom: calc(var(--u) * .3) solid rgba(255,255,255,.45); border-bottom-left-radius: calc(var(--u) * 1.2); }
  .lvl .tag { flex: none; padding: calc(var(--u) * .6) calc(var(--u) * 1.5); border-radius: calc(var(--u) * 1); font-weight: 800; font-size: calc(var(--u) * 2); white-space: nowrap; }
  .tag.station, .tag.fg { background: #fff; color: var(--navy); }
  .tag.fu { background: var(--e-tint); color: var(--e); border: calc(var(--u) * .3) solid var(--e); }
  .tag.bmk { color: #fff; border: calc(var(--u) * .3) dashed #f3a37f; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .tag.article { background: #fff; color: var(--ink); font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .lvl .desc { font-size: calc(var(--u) * 2); line-height: 1.3; opacity: .9; }
  .lvl .desc b { color: #fff; }
  .rnote { margin-top: calc(var(--u) * 1.6); font-size: calc(var(--u) * 1.7); opacity: .6; }
  ul.play { list-style: none; padding: 0; margin: 0 0 calc(var(--u) * 3.2); display: flex; flex-direction: column; gap: calc(var(--u) * 1.4); }
  .play li { display: flex; gap: calc(var(--u) * 1.6); align-items: center; font-size: calc(var(--u) * 2.15); line-height: 1.35; }
  .play .ic { flex: none; width: calc(var(--u) * 4.6); height: calc(var(--u) * 4.6); border-radius: 50%; background: rgba(255,255,255,.12);
              display: flex; align-items: center; justify-content: center; font-size: calc(var(--u) * 2.4); font-weight: 800; color: #ffd23f; }
  ol.rsteps { margin: 0; padding-left: calc(var(--u) * 3); font-size: calc(var(--u) * 2.15); line-height: 1.6; }
  /* step intro card */
  .icard { background: #fff; color: var(--ink); border-radius: calc(var(--u) * 2); padding: calc(var(--u) * 4) calc(var(--u) * 5);
           max-width: calc(var(--u) * 92); box-shadow: 0 calc(var(--u) * 1) calc(var(--u) * 4) rgba(0,0,0,.35); }
  .icard .kicker { color: var(--muted); opacity: 1; }
  .icard h2 { margin: 0 0 calc(var(--u) * 2); font-size: calc(var(--u) * 5); }
  .icard p { margin: 0 0 calc(var(--u) * 4); font-size: calc(var(--u) * 2.6); line-height: 1.45; color: var(--muted); }
  .overlay .count { font-size: calc(var(--u) * 3.2); margin: calc(var(--u) * 2) 0 calc(var(--u) * 4); }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><b>FIO</b></div>
    <div id="stepper"></div>
    <div id="status"></div>
    <div class="actions">
      <button class="btn" id="btnHint" type="button"></button>
      <button class="btn" id="btnClear" type="button"></button>
      <button class="btn primary" id="btnCheck" type="button"></button>
      <button class="btn ghost" id="btnHelp" type="button">?</button>
      <button class="btn ghost" id="btnReset" type="button"></button>
    </div>
  </header>

  <main id="stage" class="mode-build">
    <div id="field"></div>
    <div id="cols">
      <section class="col electrical" id="colE"><h2 id="hE"></h2><div class="groups"></div></section>
      <div></div>
      <section class="col mechanical" id="colM"><h2 id="hM"></h2><div class="groups"></div></section>
    </div>
    <svg class="layer" id="links"></svg>
    <svg class="layer" id="marks"></svg>
    <svg class="layer" id="ghost"></svg>
    <div id="zoomCtl"><button type="button" id="zOut" aria-label="zoom out">−</button><button type="button" id="zPct">100%</button><button type="button" id="zIn" aria-label="zoom in">+</button></div>
  </main>

  <footer id="info"></footer>
</div>

<div class="overlay" id="welcome">
  <div class="kicker" id="wKicker"></div>
  <h1 id="wTitle"></h1>
  <p class="lead" id="wLead"></p>
  <div class="steps" id="wSteps"></div>
  <div class="langs" id="wLangs"></div>
  <button class="btn primary big" id="btnStart" type="button"></button>
</div>

<div class="overlay rules hidden" id="rules">
  <div class="kicker" id="rKicker"></div>
  <h1 id="rTitle"></h1>
  <div class="rgrid">
    <section class="rcol">
      <h3 id="rProblemT"></h3><p id="rProblem"></p>
      <h3 id="rLevelsT"></h3><div class="levels" id="rLevels"></div><div class="rnote" id="rNote"></div>
    </section>
    <section class="rcol">
      <h3 id="rPlayT"></h3><ul class="play" id="rPlay"></ul>
      <h3 id="rStepsT"></h3><ol class="rsteps" id="rSteps"></ol>
    </section>
  </div>
  <button class="btn primary big" id="btnRules" type="button"></button>
</div>

<div class="overlay dark hidden" id="stepIntro">
  <div class="icard"><div class="kicker" id="siKicker"></div><h2 id="siTitle"></h2><p id="siText"></p>
    <button class="btn primary big" id="btnIntro" type="button"></button></div>
</div>

<div class="overlay dark hidden" id="idle">
  <h1 id="iTitle"></h1>
  <div class="count" id="iCount"></div>
  <button class="btn primary big" id="btnKeep" type="button"></button>
</div>

<script src="data.js"></script>
<script>
(function () {
  "use strict";
  var D = window.FIO_DATA, cfg = D.config;
  var lang = new URLSearchParams(location.search).get("lang") || cfg.lang || "pt";
  var T = D.ui[lang] || D.ui.pt;
  document.documentElement.lang = lang === "pt" ? "pt-PT" : lang;

  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage"), field = $("field"), svg = $("links"), marks = $("marks"), ghost = $("ghost"), info = $("info");
  var NS = "http://www.w3.org/2000/svg";
  // In-game zoom for steps 1 and 2 (browser zoom does nothing here: every size follows the viewport).
  var zoom = 1, ZMIN = 0.55, ZMAX = 1.4;
  function applyScale() { stage.style.setProperty("--scale", (cfg.scale || 1) * zoom); $("zPct").textContent = Math.round(zoom * 100) + "%"; }
  function setZoom(z, cx, cy) {
    z = Math.min(ZMAX, Math.max(ZMIN, z));
    if (!started || type() !== "build" || drag || Math.abs(z - zoom) < 0.001) return;
    var ratio = z / zoom, old = {}, id;
    for (id in P) old[id] = { x: P[id].x + P[id].w / 2, y: P[id].y + P[id].h / 2 };
    zoom = z; applyScale(); U = unit(); measure();
    if (cx == null) { cx = stage.clientWidth / 2; cy = stage.clientHeight / 2; }
    for (id in P) {   // pieces move towards / away from the zoom centre, like a map
      var p = P[id];
      p.x = cx + (old[id].x - cx) * ratio - p.w / 2; p.y = cy + (old[id].y - cy) * ratio - p.h / 2;
      p.vx *= ratio; p.vy *= ratio; clampPiece(p);
      els[id]._t = null; els[id].style.transform = "translate(" + p.x + "px," + p.y + "px)";
    }
    drawLinks();
  }
  applyScale();
  var STEPS = [{ type: "build", side: "electrical" }, { type: "build", side: "mechanical" }, { type: "relate" }];

  var nodeById = {}, depth = {};
  D.nodes.forEach(function (n) { nodeById[n.id] = n; });
  D.nodes.forEach(function (n) {   // level in the tree: 0 = root
    var d = 0, p = n;
    while (p.parent && nodeById[p.parent] && d < 20) { p = nodeById[p.parent]; d++; }
    depth[n.id] = d;
  });
  function art(n) { return n.article ? D.articles[n.article] : null; }
  function imageOf(n) { return n.image || (art(n) ? art(n).image : null); }
  function propOf(n) { return cfg.showProperty ? (n.prop ? L(n.prop) : supplierOf(n)) : ""; }
  function propEl(n) { var v = propOf(n); return v ? make("div", "prop", v) : null; }
  function supplierOf(n) { return n.supplier || (art(n) ? art(n).supplier : "") || ""; }
  // Master string: the parent's master string + this code. Codes that already extend the parent's
  // (LE001 -> LE001.1) are taken as they are; an article joins with "|", a "-" code brings its own
  // separator, anything else joins with "." (a leading + or . of the code becomes that ".").
  function joinMaster(pm, pcode, code, kind) {
    if (pcode && code.indexOf(pcode) === 0) return pm + code.slice(pcode.length);
    if (kind === "article") return pm + "|" + code;
    if (code.charAt(0) === "-") return pm + code;
    return pm + "." + code.replace(/^[+.]+/, "");
  }
  var masterCache = {};
  function masterOf(n) {
    if (n.masterString) return n.masterString;
    if (!masterCache[n.id]) {
      var p = n.parent && nodeById[n.parent];
      masterCache[n.id] = p ? joinMaster(masterOf(p), p.code, n.code, n.kind) : n.code;
    }
    return masterCache[n.id];
  }
  function rootOf(n) { while (n.parent && nodeById[n.parent]) n = nodeById[n.parent]; return n; }

  // ---------- helpers ----------
  function L(x) { return x && typeof x === "object" ? (x[lang] || x.pt || x.en || "") : (x || ""); }
  function make(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function S(tag, attrs) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function fmtTime(ms) { var s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  function unit() {
    var p = document.createElement("div");
    p.style.cssText = "position:absolute;visibility:hidden;width:calc(var(--u) * 1)";
    stage.appendChild(p); var w = p.getBoundingClientRect().width; p.remove(); return w || 10;
  }
  function placeholder(name) {
    name = String(name).split("/").pop();
    var t = (name.indexOf("_") >= 0 ? name.split("_").map(function (s) { return s.charAt(0); }).join("") : name).replace(/[^A-Za-z0-9]/g, "").slice(0, 3).toUpperCase();
    return "data:image/svg+xml;utf8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect x="6" y="6" width="88" height="88" rx="16" fill="#eef1f5" stroke="#9aa5b4" stroke-width="3" stroke-dasharray="8 6"/><text x="50" y="60" font-family="sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#6b7787">' + t + "</text></svg>");
  }
  function thumb(name, cls) {
    var img = new Image();
    img.className = cls; img.alt = ""; img.draggable = false;
    img.onerror = function () { img.onerror = null; img.src = placeholder(name); };
    img.src = cfg.imageDir + String(name).split("/").map(encodeURIComponent).join("/") + cfg.imageExt;
    return img;
  }
  function codeEl(n) {   // short codes stay on one line and shrink to fit; long article codes wrap after "supplier."
    var len = n.code.length, d = make("div", "code mono" + (len > 13 ? " long" : ""));
    if (len <= 13) d.style.fontSize = "calc(var(--u) * " + Math.min(2.9, 13 / (len * 0.62)).toFixed(2) + ")";
    n.code.split(/(?<=\.)/).forEach(function (part, i) { if (i && len > 13) d.appendChild(document.createElement("wbr")); d.appendChild(document.createTextNode(part)); });
    return d;
  }
  function label(n) { return n.code + " · " + n.name; }
  function sideNodes(side) { return D.nodes.filter(function (n) { return n.side === side; }); }

  // ---------- state ----------
  var started = false, step = 0, mode = "play";    // mode: play | checked | fio
  var links = [];                                  // { a, b }: build = parent -> child, relate = electrical -> mechanical
  var results = null, scores = [], maxes = [];
  var armed = null, hoverId = null, resetArmedUntil = 0, flash = null;
  var hint = { used: 0, key: null, level: 0, msg: "", pieces: {}, groups: {} };
  var startTime = 0, endTime = 0, lastActivity = Date.now(), idleShown = false, animateFio = false;
  var els = {}, groupHeads = {}, P = {};           // els: id -> DOM, P: id -> { x, y, w, h, vx, vy, dragging } (build steps)
  var U = 10, zTop = 5, dirty = false;

  function type() { return STEPS[step].type; }

  // ---------- links / key ----------
  function hasLink(a, b) { return links.some(function (l) { return l.a === a && l.b === b; }); }
  function linked(id) { return links.some(function (l) { return l.a === id || l.b === id; }); }
  function keyList() {
    if (type() === "build") {
      return sideNodes(STEPS[step].side).filter(function (n) { return n.parent; }).map(function (n) {
        return { a: n.parent, b: n.id, why: T.belongs(label(n), label(nodeById[n.parent])) };
      });
    }
    return D.answerKey.map(function (k) { return { a: k.e, b: k.m, why: L(k.why) }; });
  }
  function keyFor(a, b) { return keyList().filter(function (k) { return k.a === a && k.b === b; })[0]; }
  function inKey(id) { return D.answerKey.some(function (k) { return k.e === id || k.m === id; }); }

  function addLink(x, y) {
    var nx = nodeById[x], ny = nodeById[y], a, b;
    if (!nx || !ny || x === y) return "invalid";
    if (type() === "build") {
      a = depth[x] < depth[y] ? x : depth[x] > depth[y] ? y : x;   // upper level is the parent; same level: where the drag started
      b = a === x ? y : x;
    } else {
      if (nx.side === ny.side) return "side";
      a = nx.side === "electrical" ? x : y; b = a === x ? y : x;
    }
    if (hasLink(a, b)) return "dup";
    justAdded = a + "|" + b;
    links.push({ a: a, b: b });
    if (hint.key === a + "|" + b) clearHint();
    return "ok";
  }
  function removeLink(a, b) {
    links = links.filter(function (l) { return !(l.a === a && l.b === b); });
    dirty = true; render();
  }
  function wrongWhy(l) {
    if (type() === "build") {
      var n = nodeById[l.b];
      return n.parent ? T.belongs(label(n), label(nodeById[n.parent])) : T.wrongPair;
    }
    var ce = nodeById[l.a], cm = nodeById[l.b];
    if (!inKey(l.a)) return L(ce.note) || T.noPair(ce.code, T.sideWord.electrical);
    if (!inKey(l.b)) return L(cm.note) || T.noPair(cm.code, T.sideWord.mechanical);
    return supplierOf(ce) && supplierOf(ce) === supplierOf(cm) ? T.sameSupplier : T.wrongPair;
  }

  // ---------- step 1/2: free-floating field ----------
  function buildField(side) {
    field.replaceChildren(); els = {}; P = {};
    sideNodes(side).forEach(function (n) {
      var photo = imageOf(n), node = make("div", "piece " + (photo ? "card " : "pill ") + n.kind + " " + n.side);
      node.dataset.id = n.id;
      if (photo) {
        var ph = make("div", "ph"); ph.appendChild(thumb(photo, "thumb"));
        node.appendChild(ph); node.appendChild(codeEl(n)); node.appendChild(make("div", "nm", n.name));
        var pr = propEl(n); if (pr) node.appendChild(pr);
      } else node.appendChild(make("div", "lbl", label(n)));
      node.appendChild(make("i", "knob", "+"));
      field.appendChild(node); els[n.id] = node; P[n.id] = { x: 0, y: 0, w: 0, h: 0, vx: 0, vy: 0, dragging: false };
    });
    measure(); placeInitial();
  }
  function bounds() { return { w: stage.clientWidth, h: stage.clientHeight - 2.4 * U }; }
  function measure() {
    U = unit();
    for (var id in P) { P[id].w = els[id].offsetWidth; P[id].h = els[id].offsetHeight; }
  }
  function hk(p) { return p.h + 2.4 * U; }   // height including the ＋ knob that hangs below the piece
  function overlap(a, b, m) { return a.x < b.x + b.w + m && b.x < a.x + a.w + m && a.y < b.y + hk(b) + m && b.y < a.y + hk(a) + m; }
  function placeInitial() {
    var B = bounds(), placed = [];
    Object.keys(P).forEach(function (id) {
      var p = P[id], ok = false, t;
      for (t = 0; t < 500 && !ok; t++) {
        p.x = Math.random() * Math.max(0, B.w - p.w); p.y = Math.random() * Math.max(0, B.h - p.h);
        ok = !placed.some(function (o) { return overlap(p, o, 1.6 * U); });
      }
      placed.push(p);
      var ang = Math.random() * Math.PI * 2, sp = (cfg.driftSpeed || 2) * U * (0.7 + 0.6 * Math.random());
      p.vx = Math.cos(ang) * sp; p.vy = Math.sin(ang) * sp;
      els[id].style.transform = "translate(" + p.x + "px," + p.y + "px)";
    });
  }
  function clampPiece(p) {
    var B = bounds();
    p.x = Math.min(Math.max(0, p.x), Math.max(0, B.w - p.w)); p.y = Math.min(Math.max(0, p.y), Math.max(0, B.h - p.h));
  }
  // A piece dropped on top of others slides the least it can until it sits beside them.
  function settle(id) {
    var a = P[id], m = 0.8 * U;
    for (var it = 0; it < 12; it++) {
      var hitAny = false;
      for (var ib in P) {
        var b = P[ib]; if (b === a || !overlap(a, b, m)) continue;
        hitAny = true;
        var ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x) + m, oy = Math.min(a.y + hk(a), b.y + hk(b)) - Math.max(a.y, b.y) + m;
        if (ox < oy) a.x += (a.x + a.w / 2 < b.x + b.w / 2 ? -1 : 1) * ox;
        else a.y += (a.y + a.h / 2 < b.y + b.h / 2 ? -1 : 1) * oy;
        clampPiece(a);
      }
      if (!hitAny) break;
    }
    els[id]._t = null;
  }
  var lastTs = 0;
  function tick(ts) {
    requestAnimationFrame(tick);
    var dt = Math.min(0.05, ((ts - lastTs) / 1000) || 0); lastTs = ts;
    if (!started || type() !== "build") return;
    var ids = Object.keys(P), B = bounds(), drifting = cfg.drift && mode === "play";
    ids.forEach(function (id) {
      var p = P[id];
      p.free = drifting && !p.dragging && !p.pinned && hoverId !== id && armed !== id && !linked(id);   // pieces placed by hand stay put
      if (!p.free) return;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.x < 0) { p.x = 0; p.vx = Math.abs(p.vx); } else if (p.x > B.w - p.w) { p.x = B.w - p.w; p.vx = -Math.abs(p.vx); }
      if (p.y < 0) { p.y = 0; p.vy = Math.abs(p.vy); } else if (p.y > B.h - p.h) { p.y = B.h - p.h; p.vy = -Math.abs(p.vy); }
    });
    if (drifting) {
      ids.forEach(function (ia) {
        var a = P[ia]; if (!a.free) return;
        ids.forEach(function (ib) {
          var b = P[ib]; if (a === b || !overlap(a, b, 1 * U)) return;
          var ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x) + U, oy = Math.min(a.y + hk(a), b.y + hk(b)) - Math.max(a.y, b.y) + U, k = b.free ? 0.5 : 1;
          if (ox < oy) { var dx = a.x + a.w / 2 < b.x + b.w / 2 ? -1 : 1; a.x += dx * ox * k; a.vx = dx * Math.abs(a.vx); }
          else { var dy = a.y + a.h / 2 < b.y + b.h / 2 ? -1 : 1; a.y += dy * oy * k; a.vy = dy * Math.abs(a.vy); }
          clampPiece(a);
        });
      });
    }
    ids.forEach(function (id) {
      var p = P[id], t = "translate(" + p.x.toFixed(1) + "px," + p.y.toFixed(1) + "px)";
      if (els[id]._t !== t) { els[id]._t = t; els[id].style.transform = t; }
    });
    if (swayRopes(dt) || dirty) { dirty = false; updatePaths(); }
  }

  // ---------- step 3: columns ----------
  function buildColumns() {
    els = {}; groupHeads = {}; P = {};
    ["electrical", "mechanical"].forEach(function (side) {
      var root = $(side === "electrical" ? "colE" : "colM").querySelector(".groups");
      root.replaceChildren();
      sideNodes(side).filter(function (n) { return !n.parent; }).forEach(function (top) {
        var cards = [];
        (function walk(id) {
          sideNodes(side).forEach(function (c) { if (c.parent === id) { if (imageOf(c)) cards.push(c); walk(c.id); } });
        })(top.id);
        if (!cards.length) return;
        if (cfg.shuffle) shuffle(cards);
        var box = make("div", "group " + side); box.style.flex = cards.length + " 1 0";
        var head = make("div", "ghead", label(top)); groupHeads[top.id] = head;
        var list = make("div", "cards");
        cards.forEach(function (c) {
          var n = make("div", "piece rel " + c.kind + " " + side); n.dataset.id = c.id;
          if (cfg.hidePhotos === side) n.classList.add("nophoto");
          var ph = make("div", "ph"); ph.appendChild(thumb(imageOf(c), "thumb"));
          var txt = make("div", "txt"); txt.appendChild(codeEl(c)); txt.appendChild(make("div", "nm", c.name));
          var pr = propEl(c); if (pr) txt.appendChild(pr);
          n.appendChild(ph); n.appendChild(txt); n.appendChild(make("i", "dot"));
          els[c.id] = n; list.appendChild(n);
        });
        box.appendChild(head); box.appendChild(list); root.appendChild(box);
      });
    });
  }

  // ---------- geometry: organic threads ----------
  // A link is a cubic curve with a little gravity sag. Each link also carries a
  // small spring ("rope") so it lags and sways when one of its pieces moves.
  var ropes = {}, drawn = [], justAdded = null;
  function relAnchor(id) {
    var r = els[id].getBoundingClientRect(), s = stage.getBoundingClientRect();
    return { x: (nodeById[id].side === "electrical" ? r.right : r.left) - s.left, y: r.top + r.height / 2 - s.top };
  }
  function knobPt(id) { var p = P[id]; return { x: p.x + p.w / 2, y: p.y + p.h }; }
  function ends(a, b) {
    if (type() === "build") { var pb = P[b]; return { A: knobPt(a), B: { x: pb.x + pb.w / 2, y: pb.y } }; }   // parent's ＋ -> child's top
    return { A: relAnchor(a), B: relAnchor(b) };
  }
  function curve(A, B, vertical, r) {
    var dx = B.x - A.x, dy = B.y - A.y, ox = r ? r.ox : 0, oy = r ? r.oy : 0;
    var sag = Math.min(4 * U, Math.hypot(dx, dy) * 0.08), C1, C2;
    if (vertical) {
      var k = Math.max(2.5 * U, Math.abs(dy) * 0.5 + Math.abs(dx) * 0.12);   // short tangents when the child is close in height: no knots
      C1 = { x: A.x + ox, y: A.y + k + sag + oy }; C2 = { x: B.x + ox, y: B.y - k + sag + oy };
    } else {
      var h = Math.max(4 * U, Math.abs(dx) * 0.5);
      C1 = { x: A.x + h + ox, y: A.y + sag + oy }; C2 = { x: B.x - h + ox, y: B.y + sag + oy };
    }
    return {
      M: { x: (A.x + 3 * C1.x + 3 * C2.x + B.x) / 8, y: (A.y + 3 * C1.y + 3 * C2.y + B.y) / 8 },
      d: "M" + A.x + " " + A.y + " C" + C1.x + " " + C1.y + " " + C2.x + " " + C2.y + " " + B.x + " " + B.y

  function hideIdle() { idleShown = false; $("idle").classList.add("hidden"); }
  function activity() { lastActivity = Date.now(); if (idleShown) hideIdle(); }
  document.addEventListener("pointerdown", activity, true);
  document.addEventListener("keydown", activity, true);
  document.addEventListener("pointermove", function () { if (!idleShown) lastActivity = Date.now(); }, true);
  setInterval(function () {
    if (!started) return;
    var idle = (Date.now() - lastActivity) / 1000, tot = cfg.idleSeconds + cfg.idleWarnSeconds;
    if (idle >= tot) toWelcome();
    else if (idle >= cfg.idleSeconds) showIdle(Math.ceil(tot - idle));
    if (mode === "play") renderStatus();
    if (resetArmedUntil && Date.now() >= resetArmedUntil) { resetArmedUntil = 0; renderButtons(); }
  }, 500);
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("dragstart", function (e) { e.preventDefault(); });
  document.addEventListener("keydown", function (e) {
    var mod = e.ctrlKey || e.metaKey;
    if (mod && (e.key === "-" || e.key === "_")) { e.preventDefault(); setZoom(zoom / 1.15); }
    else if (mod && (e.key === "+" || e.key === "=")) { e.preventDefault(); setZoom(zoom * 1.15); }
    else if (mod && e.key === "0") { e.preventDefault(); setZoom(1); }
    else if (e.key === "f" || e.key === "F") {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function () {});
    } else if ((e.key === "Enter" || e.key === " ") && !started) { e.preventDefault(); startGame(); }
    else if (e.key === "Enter" && !$("rules").classList.contains("hidden")) { e.preventDefault(); closeRules(); }
    else if (e.key === "Enter" && !$("stepIntro").classList.contains("hidden")) { e.preventDefault(); $("stepIntro").classList.add("hidden"); }
  });

  // ---------- pointer interaction ----------
  var drag = null;
  function pieceAt(x, y) { var n = document.elementFromPoint(x, y); return n && n.closest ? n.closest(".piece") : null; }
  function stagePoint(e) { var s = stage.getBoundingClientRect(); return { x: e.clientX - s.left, y: e.clientY - s.top }; }
  function markDrop(e) {
    var t = pieceAt(e.clientX, e.clientY);
    for (var id in els) els[id].classList.remove("drop");
    if (!t || t.dataset.id === drag.from) return;
    if (type() === "relate" && nodeById[t.dataset.id].side === nodeById[drag.from].side) return;
    t.classList.add("drop");
  }
  function ghostPath(id, sp) {
    return type() === "build" ? curve(knobPt(id), sp, true, null).d : curve(relAnchor(id), sp, false, null).d;
  }
  function bump(node) { node.classList.add("shake"); setTimeout(function () { node.classList.remove("shake"); }, 400); }
  function tryLink(from, to, targetEl) {
    var r = addLink(from, to);
    if (r === "side" && targetEl) bump(targetEl);
    return r;
  }

  stage.addEventListener("pointerdown", function (e) {
    if (!started || mode !== "play" || e.button !== 0) return;
    var pc = e.target.closest ? e.target.closest(".piece") : null;
    if (!pc) return;
    e.preventDefault();
    var id = pc.dataset.id, onKnob = e.target.classList && e.target.classList.contains("knob");
    if (type() === "build" && !onKnob) {
      var p = P[id], sp = stagePoint(e);
      drag = { kind: "move", from: id, ox: sp.x - p.x, oy: sp.y - p.y, sx: e.clientX, sy: e.clientY, moved: false };
      p.dragging = true; pc.style.zIndex = ++zTop; pc.classList.add("dragging");
    } else {
      drag = { kind: "link", from: id, sx: e.clientX, sy: e.clientY, moved: false };
    }
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  });
  stage.addEventListener("pointermove", function (e) {
    if (!drag) {
      if (!started) return;
      var c = pieceAt(e.clientX, e.clientY), id = c && els[c.dataset.id] === c ? c.dataset.id : null;
      if (id !== hoverId && !(mode === "checked" && !id)) {
        hoverId = id;
        if (id && P[id]) els[id].style.zIndex = ++zTop;   // hovered piece comes to the front, so its ＋ is never hidden
        if (id) showNode(id); else showDefault();
      }
      return;
    }
    if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) drag.moved = true;
    if (!drag.moved) return;
    var sp = stagePoint(e);
    if (drag.kind === "move") {
      var p = P[drag.from]; p.x = sp.x - drag.ox; p.y = sp.y - drag.oy; clampPiece(p);
      els[drag.from].style.transform = "translate(" + p.x + "px," + p.y + "px)"; els[drag.from]._t = null;
      if (linked(drag.from)) dirty = true;
    } else {
      ghost.replaceChildren(S("path", { d: ghostPath(drag.from, sp) }));
      markDrop(e);
    }
  });
  function endDrag(e, cancelled) {
    if (!drag) return;
    var d = drag; drag = null; ghost.replaceChildren();
    for (var id in els) els[id].classList.remove("drop");
    try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
    if (d.kind === "move") { P[d.from].dragging = false; if (d.moved) { P[d.from].pinned = true; settle(d.from); } els[d.from].classList.remove("dragging"); }
    if (cancelled) { render(); return; }
    var t = pieceAt(e.clientX, e.clientY), tid = t && els[t.dataset.id] === t ? t.dataset.id : null;
    if (d.kind === "link") {
      if (d.moved) { if (tid && tid !== d.from) { tryLink(d.from, tid, t); armed = null; } }
      else if (armed && armed !== d.from) { tryLink(armed, d.from, els[d.from]); armed = null; }   // click on a piece's dot / card while armed
      else armed = armed === d.from ? null : d.from;
    } else if (!d.moved) {
      if (armed && armed !== d.from) { tryLink(armed, d.from, els[d.from]); armed = null; }
    }
    hoverId = null; dirty = true; render();
  }
  stage.addEventListener("pointerup", function (e) { endDrag(e, false); });
  stage.addEventListener("pointercancel", function (e) { endDrag(e, true); });

  // ---------- wiring ----------
  $("btnStart").addEventListener("click", startGame);
  $("btnRules").addEventListener("click", closeRules);
  $("btnHelp").addEventListener("click", function () { showRules(false); });
  $("btnIntro").addEventListener("click", function () { $("stepIntro").classList.add("hidden"); });
  $("btnKeep").addEventListener("click", function () { activity(); });
  $("btnReset").addEventListener("click", resetAll);
  $("btnHint").addEventListener("click", useHint);
  $("btnClear").addEventListener("click", clearStep);
  $("btnCheck").addEventListener("click", function () {
    if (mode === "play") { if (links.length) check(); } else if (mode === "checked") nextStep();
  });
  $("zOut").addEventListener("click", function () { setZoom(zoom / 1.15); });
  $("zIn").addEventListener("click", function () { setZoom(zoom * 1.15); });
  $("zPct").addEventListener("click", function () { setZoom(1); });
  stage.addEventListener("wheel", function (e) {   // mouse wheel and trackpad pinch (ctrlKey) zoom the field
    if (!started || type() !== "build") return;
    e.preventDefault();
    var sp = stagePoint(e);
    setZoom(zoom * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.001)), sp.x, sp.y);
  }, { passive: false });
  document.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });   // no browser zoom
  new ResizeObserver(function () {
    if (!started) return;
    U = unit();
    if (type() === "build") { measure(); for (var id in P) { clampPiece(P[id]); els[id]._t = null; } }
    drawLinks();
  }).observe(stage);

  // static texts
  $("wKicker").textContent = "3D Day";
  $("wTitle").textContent = T.welcomeTitle;
  $("wLead").textContent = T.welcomeLead;
  T.steps.forEach(function (s, i) { var d = make("div", "step"); d.appendChild(make("b", null, String(i + 1))); d.appendChild(document.createTextNode(s)); $("wSteps").appendChild(d); });
  $("btnStart").textContent = T.start;
  Object.keys(D.ui).forEach(function (code) {   // switching reloads the page in that language (works offline on file://)
    var b = make("button", "lang" + (code === lang ? " on" : ""), D.ui[code].langName || code.toUpperCase());
    b.type = "button";
    b.addEventListener("click", function () { if (code !== lang) location.search = "?lang=" + code; });
    $("wLangs").appendChild(b);
  });
  $("rKicker").textContent = T.rulesKicker; $("rTitle").textContent = T.rulesTitle;
  $("rProblemT").textContent = T.problemTitle; $("rProblem").textContent = T.problem;
  $("rLevelsT").textContent = T.levelsTitle;
  (function () {   // master string of the example's last level, built with the same rule as the game
    var ex = D.rulesExample || [], m = "", prev = null;
    ex.forEach(function (n) { m = prev ? joinMaster(m, prev.code, n.code, n.kind) : n.code; prev = n; });
    $("rNote").textContent = T.levelsNote + " " + (m && T.masterNote ? T.masterNote(m) : "");
  })();
  (D.rulesExample || []).forEach(function (ex, i) {
    var row = make("div", "lvl"), lv = T.levels[ex.kind] || [ex.kind, ""], desc = make("div", "desc");
    row.style.marginLeft = "calc(var(--u) * " + (i * 4.2) + ")";
    row.appendChild(make("span", "tag " + ex.kind, ex.code + " · " + ex.name));
    desc.appendChild(make("b", null, lv[0])); desc.appendChild(document.createTextNode(": " + lv[1]));
    row.appendChild(desc); $("rLevels").appendChild(row);
  });
  $("rPlayT").textContent = T.playTitle;
  T.play.forEach(function (it) {
    if (it[2] === "current" && !cfg.currentOnLink) return;
    var li = make("li"); li.appendChild(make("span", "ic", it[0])); li.appendChild(document.createTextNode(it[1])); $("rPlay").appendChild(li);
  });
  $("rStepsT").textContent = T.stepsTitle;
  T.stepsShort.forEach(function (t) { $("rSteps").appendChild(make("li", null, t)); });
  $("btnIntro").textContent = T.introGo;
  $("btnHelp").title = T.help; $("btnHelp").setAttribute("aria-label", T.help);
  $("iTitle").textContent = T.idleTitle;
  $("btnKeep").textContent = T.idleKeep;
  document.title = "FIO – " + T.welcomeTitle;

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
